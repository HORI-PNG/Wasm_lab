<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Java 関数の実行ページ</title>
  </head>
  <body class="min-h-screen bg-slate-50 text-slate-800 antialiased dark:bg-slate-950 dark:text-slate-100">
    <main class="mx-auto max-w-5xl px-4 py-10">
      <header class="mb-8">
        <p class="text-sm font-medium tracking-wide text-indigo-600 dark:text-indigo-400">GraalVM Web Image による Java → WebAssembly 変換</p>
        <h1 class="mt-1 text-3xl font-bold">Java 関数の実行ページ</h1>
        <p class="mt-2 text-slate-500 dark:text-slate-400">
          Java の public static メソッドを WebAssembly に変換し、TypeScript から呼び出しています。
          各カードに引数を入力して「実行」を押すと、ブラウザ内で Java の処理が動き、結果が表示されます。
        </p>
        <p id="status" class="status mt-4" data-state="loading">Java VM を起動中…</p>
      </header>
      <section id="functions" class="grid gap-4 sm:grid-cols-2"></section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
