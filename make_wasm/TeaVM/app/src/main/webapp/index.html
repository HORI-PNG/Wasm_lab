<!doctype html>
<html>
  <head>
    <title>NFC WebAssembly example</title>
    <meta http-equiv="Content-Type" content="text/html;charset=utf-8" />
    <script type="text/javascript" charset="utf-8" src="wasm-gc/nfc.wasm-runtime.js"></script>
    <!-- step01 から自動生成版のラッパーを使う（mainClass = org.example.generated.NfcWasm と対応） -->
    <script type="text/javascript" charset="utf-8" src="nfc.generated.js"></script>
    <script>
      async function main() {
        const nfc = await loadNfcGenerated("wasm-gc/nfc.wasm");
        const tolerance = 1e-12;
        const a = [
          [4, 1, 2],
          [1, 3, 0],
          [2, 0, 5],
        ];
        const results = {
          eigen: nfc.realEigenSolve(a),
          determinant: nfc.realLuGetDeterminant(a, tolerance, false),
          inverse: nfc.realLuInverse(a, tolerance, false),
          solve: nfc.realLuLeftDivide(a, [[1], [2], [3]], tolerance, false),
          svd: nfc.realSvdDecompose(a),
          rank: nfc.realSvdRank(a, tolerance),
          qr: nfc.realQrDecompose(a),
          fft: nfc.realFft([1, 2, 3, 4], 4),
          expm: nfc.realExp([[0, 1], [-1, 0]]),
        };
        console.log(results);
        document.getElementById("out").textContent = JSON.stringify(results, null, 2);
      }
    </script>
  </head>
  <body onload="main()">
    <pre id="out">loading...</pre>
  </body>
</html>
