<!doctype html>
<html>
  <head>
    <title>NFC WebAssembly example</title>
    <meta http-equiv="Content-Type" content="text/html;charset=utf-8" />
    <script type="text/javascript" charset="utf-8" src="wasm-gc/nfc.wasm-runtime.js"></script>
    <script type="text/javascript" charset="utf-8" src="nfc.js"></script>
    <script>
      async function main() {
        const nfc = await loadNfc("wasm-gc/nfc.wasm");
        const a = [
          [4, 1, 2],
          [1, 3, 0],
          [2, 0, 5],
        ];
        const results = {
          eigenValues: nfc.eigenValues(a),
          determinant: nfc.determinant(a),
          inverse: nfc.inverse(a),
          solve: nfc.solve(a, [[1], [2], [3]]),
          svd: nfc.svd(a),
          rank: nfc.rank(a),
          qr: nfc.qr(a),
          fft: nfc.fft([1, 2, 3, 4]),
          expm: nfc.expm([[0, 1], [-1, 0]]),
        };
        console.log(results);
        document.getElementById("out").textContent = JSON.stringify(results, null, 2);
      }
    </script>
  </head>
  <body onload="main()">
    <pre id="out">loading...</pre>
  </body>
</html>
