<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <title>Wasm Matrix Eigenvalue Solver</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h2>2x2 行列の固有値計算 (TeaVM / Wasm)</h2>
    <div>
      <input type="number" id="m00" value="1" />
      <input type="number" id="m01" value="2" /><br />
      <input type="number" id="m10" value="3" />
      <input type="number" id="m11" value="4" />
    </div>
    <button id="calc-btn">計算実行</button>
    <div id="result"></div>

    <!-- TeaVM が生成した JavaScript ラッパーと Wasm の読み込み -->
    <script src="eig_example.wasm-runtime.js"></script>
    <script src="main.js"></script>
  </body>
</html>
